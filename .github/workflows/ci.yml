name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskBoard.sln

      - name: Format check
        run: dotnet format TaskBoard.sln --verify-no-changes

      - name: Build
        run: dotnet build TaskBoard.sln --no-restore
        