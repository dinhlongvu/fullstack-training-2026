name: Playwright Tests
# Heavy end-to-end suite: boots the backend, frontend, a database and real
# browsers, so it is not run automatically on every push/PR. Trigger it on
# demand from the Actions tab (Actions -> Playwright Tests -> Run workflow).
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # ── .NET SDK (for Backend) ──────────────────────────────
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # ── Node.js (for Frontend + Playwright) ─────────────────
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # ── Backend: restore, create config & migrate DB ────────
    - name: Restore backend dependencies
      working-directory: backend
      run: dotnet restore TaskBoard.sln

    - name: Create backend config from example
      working-directory: backend
      run: cp appsettings.Development.example.json appsettings.Development.json

    - name: Install dotnet-ef tool
      run: dotnet tool install --global dotnet-ef

    - name: Apply database migrations
      working-directory: backend
      run: dotnet ef database update --project Backend.csproj

    # ── Frontend: install dependencies ──────────────────────
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    # ── Playwright: install & run ───────────────────────────
    - name: Install Playwright dependencies
      working-directory: qa/automated
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: qa/automated
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      working-directory: qa/automated
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: qa/automated/playwright-report/
        retention-days: 30
